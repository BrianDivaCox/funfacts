name: Nightly Midnight Fun Fact Automation

on:
  schedule:
    - cron: '5 7 * * *' # Runs automatically every night at 12:05 AM PDT (Midnight Pacific)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate GEMINI_API_KEY Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ ERROR: GEMINI_API_KEY secret is missing in GitHub Repository Secrets!"
            echo "------------------------------------------------------------------------"
            echo "Please follow these 4 quick steps to add your API key:"
            echo "1. Go to your repo: https://github.com/BrianDivaCox/funfacts/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: GEMINI_API_KEY"
            echo "4. Value: Paste your Gemini API Key (starts with AIzaSy...)"
            echo "------------------------------------------------------------------------"
            exit 1
          fi
          echo "✅ GEMINI_API_KEY secret verified!"

      - name: Run Daily Fun Fact Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEB_APP_URL: "https://script.google.com/macros/s/AKfycbw-Lc7XbpxcslSgdAKCQS0IMZiQWm_nOs1Pk3qtwF34slW86hDTioR74mUzA1mDl7o/exec"
        run: node scripts/daily_automation.js

      - name: Commit & Push Updated Facts Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facts.json
          git diff --staged --quiet || (git commit -m "chore: sync daily fun fact to data/facts.json" && git push)

