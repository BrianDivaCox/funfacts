name: Nightly Midnight Fun Fact Automation

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at 12:00 AM UTC (Midnight)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate GEMINI_API_KEY Secret
        if: ${{ secrets.GEMINI_API_KEY == '' }}
        run: |
          echo "❌ ERROR: GEMINI_API_KEY secret is missing in GitHub Repository Secrets!"
          echo "------------------------------------------------------------------------"
          echo "Please follow these 4 quick steps to add your API key:"
          echo "1. Go to your repo: https://github.com/BrianDivaCox/funfacts/settings/secrets/actions"
          echo "2. Click 'New repository secret'"
          echo "3. Name: GEMINI_API_KEY"
          echo "4. Value: Paste your Gemini API Key (starts with AIzaSy...)"
          echo "------------------------------------------------------------------------"
          exit 1

      - name: Run Daily Fun Fact Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEB_APP_URL: "https://script.google.com/macros/s/AKfycbxy4eoe4_VceSJrSxzX-tstmnLuRGKKkMr_VNoarVgRf5Qh-ByEGQwwJb9qqtmSIpI/exec"
        run: node scripts/daily_automation.js

